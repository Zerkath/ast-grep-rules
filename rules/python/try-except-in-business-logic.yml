---
id: try-except-in-business-logic
language: python
severity: hint
message: >
  Prefer handling exceptions at the edge (Kafka consumers, HTTP controllers, CLI entrypoints, scheduled jobs) rather than in business logic.
  Let exceptions propagate so the edge can decide retry/log/respond once. Business code should raise meaningful domain exceptions, not catch-and-handle.

  Apply this rule selectively - exclude your edge directories from the scan path, 
  or skip this rule if your architecture handles exceptions differently. `try`/`finally` (no `except`) is intentionally not flagged.
rule:
  kind: try_statement
  has:
    kind: except_clause
