---
id: prefer-named-params
language: scala
severity: warning
message: |
  Use named parameters when calling functions or constructors with 3 or more arguments.
  Named parameters make code easier to review and prevent mistakes from argument ordering.
rule:
  any:
    - kind: call_expression
    - kind: instance_expression
  has:
    field: arguments
    all:
      # at least 3 arguments (3rd named child exists)
      - has:
          stopBy: neighbor
          pattern: $_
          nthChild: 3
      # at least one argument is positional (not a `name = value` assignment)
      - has:
          stopBy: neighbor
          pattern: $_
          not:
            kind: assignment_expression
