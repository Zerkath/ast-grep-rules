---
id: print-stack-trace-scala
language: scala
severity: warning
message: >
  `.printStackTrace()` writes to stderr without log levels, timestamps, or correlation context.
  Use a logger instead: `logger.error("...", exception)` or `logger.warn("...", exception)`
  to record the exception through the normal logging pipeline.
rule:
  kind: call_expression
  has:
    kind: field_expression
    has:
      kind: identifier
      regex: ^printStackTrace$
    stopBy: end
