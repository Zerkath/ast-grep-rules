id: prefer-logger-exception
valid:
  - |
    try:
        do()
    except Exception:
        logger.exception("do failed")
  - |
    import traceback
    formatted = traceback.format_exc()
invalid:
  - |
    try:
        do()
    except Exception:
        traceback.print_exc()
  - |
    try:
        do()
    except Exception:
        traceback.print_exc(file=sys.stderr)
