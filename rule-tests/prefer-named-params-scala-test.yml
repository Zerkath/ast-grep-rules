id: prefer-named-params
language: scala
valid:
  # 2 args - below threshold, no requirement
  - doSomething(a, b)
  - map.put(key, value)
  # 1 arg
  - println("hello")
  - doSomething(value)
  # all named - 3 args
  - User(firstName = "John", lastName = "Doe", age = 42)
  - doSomething(active = true, deleted = false, name = "hello")
  - new Config(host = "host", port = 8080, ssl = true)
  # all named - 4 args
  - createConfig(host = "h", port = 8080, ssl = true, debug = false)
  - new Connection(host = "h", port = 8080, ssl = true, debug = false)
  # all named - 5 args
  - buildQuery(table = "users", col = "id", op = "=", val = 1, limit = 10)
invalid:
  # positional - 3 args
  - |
    User("John", "Doe", 42)
  - |
    doSomething(true, false, "hello")
  - |
    new Config("host", 8080, true)
  # positional - 4 args
  - |
    createConfig("host", 8080, true, false)
  - |
    new Connection("host", 8080, true, false)
  # mixed (some named, some positional)
  - |
    createThing("value", count = 3, flag = true)
  # positional - 5 args
  - |
    buildQuery("users", "id", "=", 1, 10)
